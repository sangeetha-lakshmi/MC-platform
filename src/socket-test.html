<!DOCTYPE html>
<html>
<head>
  <title>Socket Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<h2>WebSocket Test</h2>

<script>
  const socket = io("http://localhost:5000");

  socket.on("connect", () => {
    console.log("✅ Connected:", socket.id);

    const customerId = 65;  // MUST match DB

    // 🔥 FIXED EVENT NAME
    socket.emit("joinCustomerRoom", customerId);

    console.log("Joined room:", "customer_" + customerId);
  });

  socket.on("orderAccepted", (data) => {
    console.log("🔥 ACCEPT:", data.message);
  });

  socket.on("orderPicked", (data) => {
    console.log("🟡 PICKED:", data.message);
  });

  socket.on("orderCompleted", (data) => {
    console.log("🔵 COMPLETED:", data.message);
  });

  socket.on("disconnect", () => {
    console.log("❌ Disconnected");
  });

  socket.on("connect_error", (err) => {
    console.error("❌ Connection Error:", err.message);
  });

</script>

</body>
</html>
